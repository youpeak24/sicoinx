version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sicoin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sicoin_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: sicoin_db
    ports:
      - "5432:5432"
    volumes:
      - sicoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicoin_user -d sicoin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sicoin_pgdata:
    driver: local
