<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="siBgGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#175CFF" />
      <stop offset="100%" stop-color="#123B9A" />
    </linearGradient>
    <linearGradient id="siAccentGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF4FF" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#175CFF" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Rounded Polygon / Coin Shield -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#siBgGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle Internal Orbital Ring -->
  <circle cx="60" cy="60" r="44" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 3" />
  
  <!-- Subtle Precision Grid Marker -->
  <circle cx="60" cy="18" r="2.5" fill="#60A5FA" />
  <circle cx="60" cy="102" r="2.5" fill="#60A5FA" />
  <circle cx="18" cy="60" r="2.5" fill="#60A5FA" />
  <circle cx="102" cy="60" r="2.5" fill="#60A5FA" />

  <!-- Monogram Glyph: Typographic 'S' and 'I' Interlock -->
  <!-- 'S' Path -->
  <path d="M49 42C46 39 41 38 36 40C31.5 41.8 30 46 31.5 49.5C33 53 38 55 43 57C49 59.5 54 63 52.5 70C51 77 43 81 35 79.5C29 78.3 25 73.5 24 70" 
        stroke="url(#siAccentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 'I' Column with Precise Finials -->
  <path d="M68 39V79" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  
  <!-- Innovation Spark / Quantum Precision Dot for SI -->
  <circle cx="86" cy="40" r="4.5" fill="#93C5FD" />
  <path d="M86 48V78" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />
</svg>
